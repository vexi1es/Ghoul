<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Launch Lab 21 — платформа инкубатора</title>
<style>
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#f2f2f5; --surface-3:#e8e8ed;
  --text:#1d1d1f; --text-2:#6e6e73; --text-3:#8e8e93;
  --sep:rgba(0,0,0,.08); --sep-strong:rgba(0,0,0,.14);
  --accent:#7b1fd9; --accent-hover:#6a16c0; --accent-soft:rgba(134,27,227,.10); --on-accent:#fff;
  --green:#12a063; --green-soft:rgba(68,235,153,.20);
  --orange:#c46a00; --orange-soft:rgba(255,159,10,.16);
  --red:#e0342a; --red-soft:rgba(255,59,48,.10);
  --nav-bg:rgba(245,245,247,.72);
  --shadow-sm:0 1px 2px rgba(0,0,0,.04),0 1px 1px rgba(0,0,0,.02);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.06);
  --shadow-lg:0 2px 6px rgba(0,0,0,.06),0 30px 80px rgba(0,0,0,.18);
  --r-sm:10px; --r:18px; --r-lg:26px;
  --ease:cubic-bezier(.25,.1,.25,1); --ease-out:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000; --surface:#1c1c1e; --surface-2:#2c2c2e; --surface-3:#3a3a3c;
    --text:#f5f5f7; --text-2:#a1a1a6; --text-3:#8a8a8e;
    --sep:rgba(255,255,255,.09); --sep-strong:rgba(255,255,255,.16);
    --accent:#b06bff; --accent-hover:#c38aff; --accent-soft:rgba(176,107,255,.16); --on-accent:#fff;
    --green:#44eb99; --green-soft:rgba(68,235,153,.14);
    --orange:#ffb340; --orange-soft:rgba(255,179,64,.14);
    --red:#ff6961; --red-soft:rgba(255,105,97,.14);
    --nav-bg:rgba(22,22,23,.72);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    --shadow-lg:0 30px 80px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:100%/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
h1,h2,h3{margin:0;font-weight:700}
p{margin:0}
[hidden]{display:none!important}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:8px}

/* ---------- Nav (translucent material) ---------- */
.nav{position:sticky;top:0;z-index:50;background:var(--nav-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--sep)}
.nav-in{max-width:1120px;margin:0 auto;height:56px;padding:0 20px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);font-weight:700;letter-spacing:-.01em;margin-right:auto;white-space:nowrap}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#861be3,#44eb99);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;letter-spacing:-.03em}
.nav-links{display:flex;gap:2px}
.nav-link{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;color:var(--text-2);font-size:14px;font-weight:500;transition:background .2s var(--ease),color .2s var(--ease)}
.nav-link:hover{color:var(--text);background:var(--surface-2)}
.nav-link.active{color:var(--text);background:var(--surface-3)}
.role-pill{display:flex;align-items:center;gap:6px;margin-left:8px;padding:6px 6px 6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--sep);font-size:13px;font-weight:600;white-space:nowrap}
.role-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.role-pill.curator .dot{background:var(--accent)}
.role-pill button{border:0;background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--text-2)}
@media (max-width:760px){.nav-link span{display:none}.nav-link{padding:8px 10px}.role-name{display:none}.brand b{display:none}}

/* ---------- Layout ---------- */
main{max-width:1120px;margin:0 auto;padding:32px 20px 120px}
.narrow{max-width:760px;margin:0 auto}
.view-enter{animation:viewIn .42s var(--ease-out) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.01em;margin-bottom:6px}
.display{font-size:clamp(2.3rem,6vw,4.2rem);line-height:1.04;letter-spacing:-.035em;font-weight:800}
.title{font-size:clamp(1.8rem,4vw,2.5rem);line-height:1.1;letter-spacing:-.025em;font-weight:750}
.h2{font-size:1.35rem;line-height:1.2;letter-spacing:-.015em}
.h3{font-size:1.05rem;letter-spacing:-.01em}
.lead{font-size:1.1rem;line-height:1.5;color:var(--text-2);letter-spacing:-.005em}
.muted{color:var(--text-2)}
.small{font-size:13px;letter-spacing:.005em}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.spacer{flex:1}
.stack>*+*{margin-top:16px}
.section-head{display:flex;align-items:flex-end;gap:12px;margin:40px 0 14px}
.section-head .h2{margin-right:auto}

.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--sep)}
.pad{padding:24px}
@media (max-width:600px){.pad{padding:18px}main{padding:22px 16px 120px}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border-radius:999px;border:1px solid transparent;background:var(--surface-2);color:var(--text);font-size:15px;font-weight:600;letter-spacing:-.005em;cursor:pointer;white-space:nowrap;text-decoration:none;transition:transform .12s var(--ease),background .2s var(--ease),opacity .2s;-webkit-tap-highlight-color:transparent;user-select:none}
.btn:hover{background:var(--surface-3)}
.btn:active,.icon-btn:active,.mrow:active,.tap:active{transform:scale(.97);transition-duration:.08s}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:var(--sep-strong)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--red);background:var(--red-soft)}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px}
.btn.lg{min-height:50px;padding:0 26px;font-size:17px}
.btn[disabled]{opacity:.4;pointer-events:none}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:50%;border:0;background:var(--surface-2);color:var(--text-2);cursor:pointer;transition:transform .12s,background .2s}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.icon-btn.danger:hover{color:var(--red)}

/* ---------- Chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.orange{background:var(--orange-soft);color:var(--orange)}
.chip.red{background:var(--red-soft);color:var(--red)}
.tag{display:inline-flex;padding:4px 11px;border-radius:999px;border:1px solid var(--sep-strong);font-size:13px;color:var(--text-2);background:transparent;cursor:default}
button.tag{cursor:pointer;transition:background .2s,color .2s,border-color .2s}
button.tag:hover{border-color:var(--text-3)}
button.tag.on{background:var(--text);color:var(--bg);border-color:var(--text)}

/* ---------- Forms ---------- */
.field{display:block;margin-bottom:22px}
.field:last-child{margin-bottom:0}
.label{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:600;margin-bottom:8px;letter-spacing:-.005em}
.label .opt{font-weight:500;font-size:12px;color:var(--text-3)}
.label .req{color:var(--accent)}
.input,.textarea,.select{width:100%;border:1px solid var(--sep-strong);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:16px;line-height:1.45;transition:border-color .15s,box-shadow .15s;outline:none}
.textarea{resize:vertical;min-height:108px}
.input::placeholder,.textarea::placeholder{color:var(--text-3)}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.hint-row{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:12px;color:var(--text-3)}
.err{color:var(--red);font-weight:600;display:none}
.invalid .input,.invalid .textarea{border-color:var(--red);box-shadow:0 0 0 4px var(--red-soft)}
.invalid .err{display:inline}
.check{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:15px}
.switch{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--surface-3);position:relative;cursor:pointer;transition:background .25s var(--ease);flex:none;margin:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .32s cubic-bezier(.3,1.3,.5,1)}
.switch:checked{background:var(--green)}
.switch:checked::after{transform:translateX(18px)}
.search{position:relative;flex:1;min-width:200px}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.search .input{padding-left:38px;border-radius:999px;background:var(--surface)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

/* ---------- Entry ---------- */
.hero{text-align:center;padding:40px 0 36px}
.hero .lead{max-width:600px;margin:18px auto 0}
.grad{background:linear-gradient(90deg,#861be3,#2fbf7d);-webkit-background-clip:text;background-clip:text;color:transparent}
@media (prefers-color-scheme:dark){.grad{background-image:linear-gradient(90deg,#b06bff,#44eb99)}}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px auto 36px;max-width:900px}
.flow div{padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--sep);font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center}
.flow b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:13px;flex:none}
@media (max-width:760px){.flow{grid-template-columns:1fr 1fr}}
.entry-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;max-width:980px;margin:0 auto}
@media (max-width:820px){.entry-grid{grid-template-columns:1fr}}
.entry h2{font-size:1.5rem;letter-spacing:-.02em;margin:10px 0 6px}
.entry-ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:var(--accent-soft);color:var(--accent)}
.entry-ic.green{background:var(--green-soft);color:var(--green)}
.plist{margin:18px 0 16px;display:grid;gap:8px}
.pitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid var(--sep);background:var(--surface-2);cursor:pointer;transition:background .2s,transform .12s}
.pitem:hover{background:var(--surface-3)}
.pitem:active{transform:scale(.985)}
.pitem .meta{flex:1;min-width:0}
.pitem .meta b{display:block;font-size:15px}
.pitem .meta span{display:block;font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Avatars ---------- */
.ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex:none;letter-spacing:-.02em}
.ava.lg{width:52px;height:52px;font-size:18px}
.proj-ava{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;flex:none;letter-spacing:-.03em}
.ava-stack{display:flex}
.ava-stack .ava{border:2px solid var(--surface);margin-left:-8px}
.ava-stack .ava:first-child{margin-left:0}

/* ---------- Project dashboard ---------- */
.dash{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}
@media (max-width:900px){.dash{grid-template-columns:1fr}}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .track{stroke:var(--surface-2)}
.ring .val{stroke:url(#ringGrad);transition:stroke-dashoffset .9s var(--ease-out)}
.ring .num{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .num b{font-size:30px;letter-spacing:-.03em;line-height:1}
.ring .num span{font-size:12px;color:var(--text-2);margin-top:3px}
.bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#861be3,#44eb99);transition:width .7s var(--ease-out)}

.modules{display:grid;gap:10px}
.mrow{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--sep);box-shadow:var(--shadow-sm);color:var(--text);transition:transform .12s var(--ease),box-shadow .2s,border-color .2s}
a.mrow:hover{box-shadow:var(--shadow);border-color:var(--sep-strong)}
.mrow.current{border-color:color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow-sm)}
.mrow.locked{opacity:.55;cursor:not-allowed}
.mrow.locked:active{transform:none}
.mnum{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--surface-2);color:var(--text-2);flex:none}
.mrow.done .mnum{background:var(--green);color:#04341f}
.mrow.current .mnum{background:var(--accent);color:#fff}
.mrow .mt{flex:1;min-width:0}
.mrow .mt b{display:block;font-size:16px;letter-spacing:-.01em}
.mrow .mt span{display:block;font-size:13px;color:var(--text-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .chev{color:var(--text-3)}

.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;width:84px;text-align:center;font-size:11.5px;font-weight:600;color:var(--text-2);line-height:1.2}
.badge .medal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--surface-2);filter:grayscale(1);opacity:.45;transition:filter .4s,opacity .4s,transform .4s var(--ease-out)}
.badge.on{color:var(--text)}
.badge.on .medal{filter:none;opacity:1;background:linear-gradient(145deg,var(--accent-soft),var(--green-soft));box-shadow:inset 0 0 0 1px var(--sep)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--sep);font-size:14px}
.kv:first-child{border-top:0}
.kv span{color:var(--text-2)}

/* ---------- Module ---------- */
.back{display:inline-flex;align-items:center;gap:4px;font-size:15px;font-weight:500;margin-bottom:18px}
.stepper{display:flex;gap:6px;margin:18px 0 22px}
.stepper a,.stepper span{flex:1;height:5px;border-radius:999px;background:var(--surface-3)}
.stepper .done{background:var(--green)}
.stepper .cur{background:var(--accent)}
.task{display:flex;gap:12px;padding:16px 18px;border-radius:var(--r);background:var(--accent-soft);color:var(--text);margin-bottom:18px;font-size:15px}
.task .ic{color:var(--accent);margin-top:2px}
.ro{white-space:pre-wrap;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:15px;min-height:46px}
.ro .none{color:var(--text-3);font-style:italic}
.actionbar{position:sticky;bottom:16px;z-index:20;margin-top:18px;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;border-radius:999px;background:var(--nav-bg);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border:1px solid var(--sep);box-shadow:var(--shadow)}
.savestate{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);margin-right:auto;min-width:0}
.savestate .ic{color:var(--green)}
.savestate.saving .ic{color:var(--text-3)}
@media (max-width:560px){.actionbar{border-radius:20px;flex-wrap:wrap;padding:12px}.actionbar .btn{flex:1}}
.comment{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--sep)}
.comment:first-child{border-top:0;padding-top:0}
.comment .body{flex:1;min-width:0}
.comment .who{font-size:13px;font-weight:700}
.comment .who time{font-weight:400;color:var(--text-3);margin-left:6px}
.comment p{white-space:pre-wrap;font-size:15px;margin-top:2px}
.ver{border-top:1px solid var(--sep);padding:12px 0}
.ver:first-child{border-top:0;padding-top:0}
.ver summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;font-size:14px;font-weight:600}
.ver summary::-webkit-details-marker{display:none}
.ver .vbody{margin-top:10px;display:grid;gap:8px;font-size:14px}
.ver .vbody div{padding:10px 12px;background:var(--surface-2);border-radius:10px;white-space:pre-wrap}
.ver .vbody small{display:block;color:var(--text-3);font-weight:600;margin-bottom:2px;white-space:normal}

/* ---------- One-pager ---------- */
.op-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.onepager{max-width:860px;margin:0 auto;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);border:1px solid var(--sep);padding:56px 60px;overflow:hidden;position:relative}
.onepager::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,#861be3,#44eb99)}
@media (max-width:640px){.onepager{padding:30px 22px;border-radius:var(--r)}}
.op-top{display:flex;gap:18px;align-items:flex-start}
.op-top h1{font-size:clamp(2rem,5vw,3rem);letter-spacing:-.035em;line-height:1.04;font-weight:800}
.op-top .lead{margin-top:10px}
.op-meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;padding-top:18px;border-top:1px solid var(--sep);font-size:13px;color:var(--text-2)}
.op-meta b{color:var(--text)}
.op-summary{margin-top:28px;padding:22px 24px;border-radius:var(--r);background:linear-gradient(135deg,var(--accent-soft),var(--green-soft));font-size:17px;line-height:1.5;letter-spacing:-.01em}
.op-summary small{display:block;font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px;letter-spacing:.02em;text-transform:uppercase}
.op-team{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:12px}
.op-team .m{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--surface-2)}
.op-team .m b{display:block;font-size:14px}
.op-team .m span{display:block;font-size:12px;color:var(--text-2)}
.op-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin:36px 0 4px}
.op-sec{margin-top:34px;break-inside:avoid}
.op-sec-h{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--sep);margin-bottom:16px}
.op-sec-h .n{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);font-size:13px;font-weight:700;color:var(--text-2);flex:none}
.op-sec-h h2{font-size:1.35rem;letter-spacing:-.02em;margin-right:auto}
.op-dl{display:grid;grid-template-columns:200px 1fr;gap:14px 24px;margin:0}
.op-dl dt{font-size:13px;font-weight:600;color:var(--text-2);padding-top:2px}
.op-dl dd{margin:0;font-size:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.op-dl dd.dash{color:var(--text-3)}
@media (max-width:640px){.op-dl{grid-template-columns:1fr;gap:2px}.op-dl dd{margin-bottom:12px}}
.empty-sec{display:flex;gap:14px;align-items:center;padding:20px;border:1.5px dashed var(--sep-strong);border-radius:var(--r);color:var(--text-2)}
.empty-sec .ic{width:26px;height:26px;color:var(--text-3)}

.empty{padding:48px 20px;text-align:center;color:var(--text-2)}

.gcard{display:flex;flex-direction:column;overflow:hidden;transition:transform .35s var(--ease-out),box-shadow .35s}

.gcover .proj-ava{box-shadow:0 8px 20px rgba(0,0,0,.2);border:2px solid rgba(255,255,255,.7)}

/* ---------- Spring physics (Apple: damping ratio + response) ---------- */
function spring({ from, to, velocity = 0, response = .35, damping = 1, onUpdate, onDone }) {
  if (reduceMotion.matches) { onUpdate(to); onDone && onDone(); return { stop() {} }; }
  const k = Math.pow(2 * Math.PI / response, 2), c = 4 * Math.PI * damping / response;
  let x = from, v = velocity, last = performance.now(), raf = 0, stopped = false;
  const step = (now) => {
    if (stopped) return;
    const dt = Math.min(.064, (now - last) / 1000); last = now;
    const n = 4, h = dt / n;
    for (let i = 0; i < n; i++) { const a = -k * (x - to) - c * v; v += a * h; x += v * h; }
    if (Math.abs(x - to) < .5 && Math.abs(v) < 12) { onUpdate(to); onDone && onDone(); return; }
    onUpdate(x); raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
  return { stop() { stopped = true; cancelAnimationFrame(raf); } };
}
const project = (v, d = .998) => (v / 1000) * d / (1 - d);
const rubberband = (o, dim, c = .55) => (o * dim * c) / (dim + c * Math.abs(o));

/* ---------- Sheet ---------- */
const Sheet = { root:null, panel:null, scrim:null, y:0, h:1, anim:null, target:0, onClose:null, lastFocus:null };
function setSheetY(y) {
  Sheet.y = y;
  Sheet.panel.style.transform = `translate3d(0,${y}px,0)`;
  Sheet.scrim.style.opacity = String(Math.max(0, Math.min(1, 1 - y / Sheet.h)));
}
function animSheet(to, velocity, opts, onDone) {
  Sheet.anim && Sheet.anim.stop();
  Sheet.target = to;
  Sheet.anim = spring({ from: Sheet.y, to, velocity, ...opts, onUpdate: setSheetY, onDone });
}
function openSheet({ title, body, footer = '', wide = false, onMount, onClose }) {
  if (Sheet.root) removeSheetNow();
  const root = document.createElement('div');
  root.className = 'sheet-root';
  root.innerHTML = `<div class="scrim" data-action="close-sheet"></div>
    <div class="sheet ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="sheet-grab" data-grab><span></span></div>
      <div class="sheet-head" data-grab><h2>${esc(title)}</h2><button class="icon-btn" data-action="close-sheet" aria-label="Закрыть">${icon('x')}</button></div>
      <div class="sheet-body">${body}</div>
      ${footer ? `<div class="sheet-foot">${footer}</div>` : ''}
    </div>`;
  document.body.appendChild(root);
  Object.assign(Sheet, { root, panel: root.querySelector('.sheet'), scrim: root.querySelector('.scrim'), onClose, lastFocus: document.activeElement });
  Sheet.h = Math.max(240, innerHeight - Sheet.panel.getBoundingClientRect().top);
  setSheetY(Sheet.h);
  animSheet(0, 0, { damping: 1, response: .38 });
  onMount && onMount(Sheet.panel);
  setTimeout(() => { if (!Sheet.panel) return; const f = Sheet.panel.querySelector('.sheet-body input:not([type=checkbox]),.sheet-body textarea') || Sheet.panel.querySelector('.sheet-foot .primary'); f && f.focus({ preventScroll: true }); }, 80);
}
function closeSheet(velocity = 0) {
  if (!Sheet.root) return;
  animSheet(Sheet.h, velocity, { damping: 1, response: .3 }, removeSheetNow);
}
function removeSheetNow() {
  if (!Sheet.root) return;
  Sheet.anim && Sheet.anim.stop();
  Sheet.root.remove();
  const cb = Sheet.onClose, lf = Sheet.lastFocus;
  Object.assign(Sheet, { root:null, panel:null, scrim:null, onClose:null, lastFocus:null });
  cb && cb();
  lf && lf.focus && document.contains(lf) && lf.focus({ preventScroll: true });
}
// Drag-to-dismiss: 1:1 tracking, rubber-band, velocity projection, interruptible
document.addEventListener('pointerdown', (e) => {
  const g = e.target.closest('[data-grab]');
  if (!g || !Sheet.panel || e.button > 0 || e.target.closest('button')) return;
  Sheet.anim && Sheet.anim.stop();
  const st = { id: e.pointerId, y0: e.clientY, base: Sheet.y, samples: [{ t: e.timeStamp, y: e.clientY }], active: false };
  const move = (ev) => {
    if (ev.pointerId !== st.id || !Sheet.panel) return;
    const dy = ev.clientY - st.y0;
    if (!st.active) { if (Math.abs(dy) < 6) return; st.active = true; try { g.setPointerCapture(st.id); } catch (_) {} Sheet.panel.classList.add('dragging'); }
    let y = st.base + dy;
    if (y < 0) y = -rubberband(-y, Sheet.h);
    setSheetY(y);
    st.samples.push({ t: ev.timeStamp, y: ev.clientY }); if (st.samples.length > 8) st.samples.shift();
  };
  const up = (ev) => {
    if (ev.pointerId !== st.id) return;
    removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
    if (!Sheet.panel) return;
    Sheet.panel.classList.remove('dragging');
    if (!st.active) { if (Sheet.y !== Sheet.target) Sheet.target === Sheet.h ? closeSheet() : animSheet(0, 0, { damping: 1, response: .35 }); return; }
    const last = st.samples[st.samples.length - 1];
    const first = st.samples.find(s => last.t - s.t < 100) || st.samples[0];
    const v = (last.y - first.y) / Math.max(1, last.t - first.t) * 1000;
    if (Sheet.y + project(v) > Sheet.h * .45) closeSheet(v);
    else animSheet(0, v, { damping: .8, response: .3 });
  };
  addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
});

/* ---------- Clipboard + share encoding ---------- */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove(); return ok;
  }
}
function encodeShare(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj)); let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decodeShare(str) {
  const b64 = str.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}

function viewModule(p, mid) {
  const i = S.modules.findIndex(m => m.id === mid);
  if (i < 0) return viewMissing('Модуль не найден');
  const m = S.modules[i], st = moduleStatus(p, i), cur = isCurator();
  if (st === 'locked' && !cur) {
    const need = S.modules[firstIncomplete(p)];
    return `<div class="denied card pad view-enter">${icon('lock')}<h1 class="h2" style="margin:12px 0 6px">Модуль пока закрыт</h1><p class="muted">Модули идут по порядку. Сначала завершите «${esc(need.title)}».</p><a class="btn primary" style="margin-top:18px" href="#/p/${p.id}/m/${need.id}">Перейти к текущему</a></div>`;
  }
  const ans = p.answers[m.id] || {};
  const comments = p.comments[m.id] || [];
  const history = (p.history[m.id] || []).slice().reverse();
  const done = isDone(p, m), changed = changedSinceSubmit(p, m);
  const review = p.review[m.id] || 'pending';
  const next = S.modules[i + 1];

  const fieldsHTML = m.fields.map(f => {
    const v = ans[f.id] || '';
    if (cur) return `<div class="field"><div class="label">${esc(f.label)}</div><div class="ro">${v ? esc(v) : '<span class="none">Нет ответа</span>'}</div></div>`;
    const ctrl = f.type === 'text'
      ? `<input class="input" id="f_${esc(f.id)}" data-field="${esc(f.id)}" placeholder="${esc(f.placeholder)}" value="${esc(v)}" maxlength="400" ${f.required ? 'aria-required="true"' : ''}>`
      : `<textarea class="textarea" id="f_${esc(f.id)}" data-field="${esc(f.id)}" placeholder="${esc(f.placeholder)}" rows="4" maxlength="3000" ${f.required ? 'aria-required="true"' : ''}>${esc(v)}</textarea>`;
    return `<div class="field" data-fbox="${esc(f.id)}"><label class="label" for="f_${esc(f.id)}">${esc(f.label)}${f.required ? '<span class="req" aria-hidden="true">*</span>' : '<span class="opt">необязательно</span>'}</label>${ctrl}<div class="hint-row"><span class="err">Заполните это поле, чтобы завершить модуль</span><span class="spacer"></span><span data-count>${v.length}</span></div></div>`;
  }).join('');

  return `<div class="narrow view-enter">
    <a class="back" href="#/p/${p.id}">${icon('chevL')}${esc(p.name)}</a>
    <div class="eyebrow">Модуль ${i + 1} из ${S.modules.length}</div>
    <div class="row wrap" style="gap:10px"><h1 class="title" style="margin-right:auto">${esc(m.title)}</h1>
      ${done ? reviewChip(review) : '<span class="chip accent">Текущий</span>'}${changed ? '<span class="chip orange">Изменено после отправки</span>' : ''}</div>
    <div class="stepper" aria-hidden="true">${S.modules.map((mm, j) => { const s = moduleStatus(p, j); return (s !== 'locked' || cur) ? `<a href="#/p/${p.id}/m/${mm.id}" class="${s === 'done' ? 'done' : j === i ? 'cur' : ''}" title="${esc(mm.title)}"></a>` : `<span title="${esc(mm.title)}"></span>`; }).join('')}</div>
    ${m.task ? `<div class="task">${icon('bulb')}<div><b>Задание.</b> ${esc(m.task)}</div></div>` : ''}

    <form class="card pad" data-module data-pid="${p.id}" data-mid="${m.id}" onsubmit="return false" novalidate>${fieldsHTML}</form>

    ${cur ? `
      <div class="actionbar">
        <span class="savestate">${done ? `Отправлено ${rel(p.submitted[m.id])}` : hasContent(p, m) ? 'Черновик, не отправлен' : 'Команда ещё не отвечала'}</span>
        ${done ? `<button class="btn sm ${review === 'changes' ? 'primary' : 'ghost'}" data-action="review" data-v="changes">На доработку</button><button class="btn sm ${review === 'approved' ? 'primary' : 'ghost'}" data-action="review" data-v="approved">${icon('check')}Принять</button>` : ''}
      </div>` : `
      <div class="actionbar">
        <span class="savestate" id="savestate">${icon('check')}<span>${hasContent(p, m) ? 'Все изменения сохранены' : 'Ответы сохраняются автоматически'}</span></span>
        <a class="btn ghost" href="#/p/${p.id}/onepager">${icon('eye')}One-pager</a>
        <button class="btn primary" data-action="submit-module">${done ? (changed ? 'Отправить новую версию' : 'Отправить заново') : 'Завершить модуль'}</button>
      </div>`}

    <div class="section-head"><h2 class="h2">Комментарии</h2><span class="muted small">${comments.length}</span></div>
    <section class="card pad">
      ${comments.length ? comments.map(c => `<div class="comment">${ava(c.author)}<div class="body"><div class="who">${esc(c.author)}${c.role === 'curator' ? ' <span class="chip accent" style="padding:1px 7px">куратор</span>' : ''}<time>${rel(c.at)}</time></div><p>${esc(c.text)}</p></div></div>`).join('') : `<p class="muted small">${cur ? 'Оставьте первый комментарий к ответам команды.' : 'Здесь появятся комментарии куратора к вашим ответам.'}</p>`}
      <div class="row" style="margin-top:16px;align-items:flex-end">
        <textarea class="textarea" id="cmt" rows="2" style="min-height:48px" placeholder="${cur ? 'Комментарий для команды…' : 'Ответить куратору…'}" aria-label="Комментарий"></textarea>
        <button class="icon-btn" style="width:44px;height:44px;background:var(--accent);color:#fff" data-action="add-comment" aria-label="Отправить комментарий">${icon('send')}</button>
      </div>
    </section>

    <div class="section-head"><h2 class="h2">История версий</h2><span class="muted small">${history.length}</span></div>
    <section class="card pad">
      ${history.length ? history.map((v, k) => `<details class="ver"><summary>${icon('clock')}<span style="margin-right:auto">Версия ${history.length - k}${k === 0 ? ' · последняя' : ''}</span><span class="muted small" style="font-weight:400">${fmtDate(v.at)}</span>${!cur ? `<button class="btn sm ghost" data-action="restore" data-idx="${history.length - 1 - k}">${icon('restore')}Восстановить</button>` : ''}</summary>
        <div class="vbody">${m.fields.map(f => `<div><small>${esc(f.label)}</small>${v.values[f.id] ? esc(v.values[f.id]) : '<span style="color:var(--text-3)">—</span>'}</div>`).join('')}</div></details>`).join('') : '<p class="muted small">Версия появится после завершения модуля. Каждая повторная отправка сохраняется отдельно.</p>'}
    </section>
    ${next && done && !cur ? `<div style="text-align:center;margin-top:28px"><a class="btn lg ghost" href="#/p/${p.id}/m/${next.id}">Следующий модуль: ${esc(next.title)}${icon('chevR')}</a></div>` : ''}
  </div>`;
}

    </div>

      <button class="tag ${!ui.peopleSkill ? 'on' : ''}" data-action="people-skill" data-v="">Все навыки</button>
      ${skills.map(s => `<button class="tag ${ui.peopleSkill === s ? 'on' : ''}" data-action="people-skill" data-v="${esc(s)}">${esc(s)}</button>`).join('')}

function viewDenied() {
  return `<div class="denied card pad view-enter">${icon('lock')}<h1 class="h2" style="margin:12px 0 6px">Нет доступа</h1><p class="muted">Участник видит только свой проект. Ответы других команд доступны куратору, а их one-pager — если команда опубликовала его в галерее.</p><a class="btn primary" style="margin-top:18px" href="#/">К своему проекту</a></div>`;
}
function viewMissing(msg = 'Проект не найден') {
  return `<div class="denied card pad view-enter">${icon('search')}<h1 class="h2" style="margin:12px 0 6px">${esc(msg)}</h1><p class="muted">Возможно, он был удалён.</p><a class="btn primary" style="margin-top:18px" href="#/">На главную</a></div>`;
}

/* ---------- Router ---------- */
function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (session.role === 'participant' && !getP(session.projectId)) { session.role = null; session.projectId = null; saveSession(); }
  let html;
  if (parts[0] === 'share') html = viewShare(parts.slice(1).join('/'));
  else if (!session.role) { if (parts.length) { location.replace('#/'); return; } html = viewEntry(); }
  else if (parts[0] === 'p') {
    const p = getP(parts[1]);
    if (!p) html = viewMissing();
    else if (parts[2] === 'onepager') html = canSee(p, 'onepager') ? viewOnePager(p) : viewDenied();
    else if (!canSee(p)) html = viewDenied();
    else if (parts[2] === 'm') html = viewModule(p, parts[3]);
    else html = viewProject(p);
  }
  else if (parts[0] === 'curator') html = isCurator() ? viewCurator() : viewDenied();
  else if (parts[0] === 'modules') html = isCurator() ? viewModulesAdmin() : viewDenied();
  else if (parts[0] === 'gallery') html = viewGallery();
  else if (parts[0] === 'people') html = viewPeople();
  else { location.replace(isCurator() ? '#/curator' : `#/p/${session.projectId}`); return; }

  $('#nav').innerHTML = parts[0] === 'share' && !session.role ? navHTML() : navHTML();
  $('#app').innerHTML = html;
  $('#footer').innerHTML = `<span>Данные хранятся локально в этом браузере и работают без интернета.</span><button data-action="reset-demo">Сбросить демо-данные</button>`;
  const title = $('#app h1'); document.title = (title ? title.textContent.trim() + ' — ' : '') + 'Launch Lab 21';
}
let lastPath = '';
addEventListener('hashchange', () => {
  const path = location.hash;
  if (Sheet.root) removeSheetNow();
  route();
  if (path !== lastPath) scrollTo({ top: 0, behavior: 'instant' });
  lastPath = path;
});
const rerender = () => { const y = scrollY; route(); $('#app .view-enter')?.classList.remove('view-enter'); scrollTo(0, y); };

/* ---------- Sheets: forms ---------- */
function membersEditorHTML(members) {
  return members.map((m, i) => `<div class="fedit" data-member="${i}" data-uid="${esc(m.id)}">
    <div class="row"><input class="input" data-k="name" placeholder="Имя и фамилия" value="${esc(m.name)}" aria-label="Имя"><input class="input" data-k="role" placeholder="Роль" value="${esc(m.role)}" style="max-width:150px" aria-label="Роль"><button type="button" class="icon-btn danger" data-action="rm-member" data-i="${i}" aria-label="Удалить участника">${icon('trash')}</button></div>
    <div class="row"><input class="input" data-k="skills" placeholder="Навыки через запятую" value="${esc((m.skills || []).join(', '))}" aria-label="Навыки"><input class="input" data-k="contact" placeholder="@telegram" value="${esc(m.contact)}" style="max-width:150px" aria-label="Контакт"></div>
    <label class="check small"><input type="checkbox" class="switch" data-k="open" ${m.openToProjects ? 'checked' : ''}>Открыт к новым проектам</label>
  </div>`).join('');
}
function readMembers(panel, prev) {
  return [...panel.querySelectorAll('[data-member]')].map(box => {
    const old = prev.find(x => x.id === box.dataset.uid) || {};
    const g = (k) => box.querySelector(`[data-k="${k}"]`);
    return { id: old.id || uid('u'), endorsements: old.endorsements || {}, name: g('name').value.trim(), role: g('role').value.trim(), skills: splitList(g('skills').value), contact: g('contact').value.trim(), openToProjects: g('open').checked };
  });
}
function projectSheet(p) {
  const isNew = !p;
  let members = p ? clone(p.members) : [{ id: uid('u'), name: '', role: '', skills: [], contact: '', openToProjects: false, endorsements: {} }];
  openSheet({
    title: isNew ? 'Новый проект' : 'Профиль проекта', wide: true,
    body: `<form id="pform" onsubmit="return false" novalidate>
      <div class="field" data-fbox="name"><label class="label" for="pf_name">Название<span class="req">*</span></label><input class="input" id="pf_name" placeholder="Например: Qatnov" value="${esc(p?.name)}" maxlength="60"><div class="hint-row"><span class="err">Введите название проекта</span></div></div>
      <div class="field"><label class="label" for="pf_desc">Краткое описание</label><textarea class="textarea" id="pf_desc" rows="2" style="min-height:70px" maxlength="240" placeholder="Одно предложение: что за продукт и для кого">${esc(p?.description)}</textarea></div>
      <div class="field"><label class="label" for="pf_tags">Теги <span class="opt">через запятую</span></label><input class="input" id="pf_tags" placeholder="EdTech, AI" value="${esc((p?.tags || []).join(', '))}"></div>
      <div class="label" style="margin-top:6px">Состав команды</div>
      <div id="members">${membersEditorHTML(members)}</div>
      <button type="button" class="btn sm ghost" data-action="add-member">${icon('plus')}Добавить участника</button>
    </form>`,
    footer: `<button class="btn ghost" data-action="close-sheet">Отмена</button><button class="btn primary" data-action="save-project">${isNew ? 'Создать проект' : 'Сохранить'}</button>`,
    onMount(panel) {
      panel._rerenderMembers = (mutate) => { members = readMembers(panel, members); mutate(members); $('#members', panel).innerHTML = membersEditorHTML(members); };
      panel._save = () => {
        const name = $('#pf_name', panel).value.trim();
        const box = panel.querySelector('[data-fbox="name"]');
        box.classList.toggle('invalid', !name);
        if (!name) { $('#pf_name', panel).focus(); return; }
        const list = readMembers(panel, members).filter(m => m.name);
        const data = { name, description: $('#pf_desc', panel).value.trim(), tags: splitList($('#pf_tags', panel).value), members: list, updatedAt: Date.now() };
        if (isNew) {
          const np = normalize({ id: uid('p'), published: false, likes: 0, createdAt: Date.now(), ...data });
          S.projects.push(np); save();
          if (!isCurator()) { session.role = 'participant'; session.projectId = np.id; saveSession(); }
          closeSheet(); location.hash = `#/p/${np.id}`;
          toast(`Проект «${name}» создан`);
        } else {
          Object.assign(p, data); save(); closeSheet(); rerender(); toast('Профиль сохранён');
        }
      };
    },
  });
}

function moduleSheet(m) {
  const isNew = !m;
  let draft = m ? clone(m) : { id: uid('m'), title: '', badge: '', emoji: '⭐', task: '', fields: [{ id: uid('f'), label: '', placeholder: '', type: 'textarea', required: true }] };
  const fieldsHTML = () => draft.fields.map((f, i) => `<div class="fedit" data-fi="${i}">
    <div class="row"><input class="input" data-k="label" placeholder="Вопрос, например: Кто ваш клиент?" value="${esc(f.label)}" aria-label="Вопрос"><button type="button" class="icon-btn danger" data-action="rm-field" data-i="${i}" aria-label="Удалить поле">${icon('trash')}</button></div>
    <input class="input" data-k="placeholder" placeholder="Подсказка внутри поля — что именно писать" value="${esc(f.placeholder)}" aria-label="Подсказка">
    <div class="row"><select class="select" data-k="type" style="max-width:200px" aria-label="Тип поля"><option value="textarea" ${f.type !== 'text' ? 'selected' : ''}>Многострочный текст</option><option value="text" ${f.type === 'text' ? 'selected' : ''}>Короткая строка</option></select>
    <label class="check small"><input type="checkbox" class="switch" data-k="required" ${f.required ? 'checked' : ''}>Обязательное</label></div>
  </div>`).join('');
  const read = (panel) => {
    draft.title = $('#mf_title', panel).value.trim(); draft.badge = $('#mf_badge', panel).value.trim();
    draft.emoji = $('#mf_emoji', panel).value.trim() || '⭐'; draft.task = $('#mf_task', panel).value.trim();
    draft.fields = [...panel.querySelectorAll('[data-fi]')].map((box, i) => ({ ...draft.fields[i], label: box.querySelector('[data-k=label]').value.trim(), placeholder: box.querySelector('[data-k=placeholder]').value.trim(), type: box.querySelector('[data-k=type]').value, required: box.querySelector('[data-k=required]').checked }));
  };
  openSheet({
    title: isNew ? 'Новый модуль' : 'Редактировать модуль', wide: true,
    body: `<form onsubmit="return false" novalidate>
      <div class="row" style="align-items:flex-start">
        <div class="field" style="width:80px"><label class="label" for="mf_emoji">Иконка</label><input class="input" id="mf_emoji" value="${esc(draft.emoji)}" maxlength="4" style="text-align:center"></div>
        <div class="field" style="flex:1" data-fbox="title"><label class="label" for="mf_title">Название<span class="req">*</span></label><input class="input" id="mf_title" value="${esc(draft.title)}" placeholder="Например: Юнит-экономика"><div class="hint-row"><span class="err">Введите название</span></div></div>
      </div>
      <div class="field"><label class="label" for="mf_task">Задание для команды</label><textarea class="textarea" id="mf_task" rows="2" style="min-height:70px" placeholder="Что команда должна сделать в этом модуле">${esc(draft.task)}</textarea></div>
      <div class="field"><label class="label" for="mf_badge">Бейдж за прохождение</label><input class="input" id="mf_badge" value="${esc(draft.badge)}" placeholder="Например: Финансист"></div>
      <div class="label">Поля шаблона ответа</div>
      <div id="mfields">${fieldsHTML()}</div>
      <button type="button" class="btn sm ghost" data-action="add-field">${icon('plus')}Добавить поле</button>
      <p class="err" id="mf_err" style="margin-top:10px"></p>
    </form>`,
    footer: `<button class="btn ghost" data-action="close-sheet">Отмена</button><button class="btn primary" data-action="save-module">${isNew ? 'Добавить' : 'Сохранить'}</button>`,
    onMount(panel) {
      panel._fields = (mutate) => { read(panel); mutate(draft.fields); $('#mfields', panel).innerHTML = fieldsHTML(); };
      panel._save = () => {
        read(panel);
        const err = $('#mf_err', panel);
        panel.querySelector('[data-fbox=title]').classList.toggle('invalid', !draft.title);
        draft.fields = draft.fields.filter(f => f.label);
        if (!draft.title) { $('#mf_title', panel).focus(); return; }
        if (!draft.fields.length) { err.textContent = 'Добавьте хотя бы одно поле с вопросом'; err.style.display = 'block'; $('#mfields', panel).innerHTML = fieldsHTML(); return; }
        if (isNew) S.modules.push(draft); else S.modules[S.modules.findIndex(x => x.id === draft.id)] = draft;
        save(); closeSheet(); rerender(); toast(isNew ? 'Модуль добавлен в программу' : 'Модуль обновлён');
      };
    },
  });
}

function completionSheet(p, m) {
  const i = S.modules.indexOf(m), next = S.modules.slice(i + 1).find(x => !isDone(p, x)) || S.modules.find(x => !isDone(p, x));
  const all = doneCount(p) === S.modules.length;
  openSheet({
    title: all ? 'Программа пройдена' : 'Модуль пройден',
    body: `<div class="celebrate"><div class="medal">${all ? '🏆' : esc(m.emoji || '⭐')}</div>
      <h3 class="h2">${all ? 'Launch Ready!' : `Бейдж «${esc(m.badge || m.title)}»`}</h3>
      <p class="muted" style="margin-top:6px">${all ? 'Все модули пройдены — one-pager собран целиком.' : `Ответы уже в one-pager. Пройдено ${doneCount(p)} из ${S.modules.length}.`}</p></div>`,
    footer: `<a class="btn ghost" href="#/p/${p.id}/onepager">${icon('doc')}One-pager</a>${next ? `<a class="btn primary" href="#/p/${p.id}/m/${next.id}">Следующий модуль${icon('chevR')}</a>` : `<a class="btn primary" href="#/p/${p.id}">К проекту</a>`}`,
  });
}

function confirmSheet({ title, text, confirm, danger = true, onConfirm }) {
  openSheet({ title, body: `<p class="muted">${esc(text)}</p>`,
    footer: `<button class="btn ghost" data-action="close-sheet">Отмена</button><button class="btn ${danger ? 'danger' : 'primary'}" data-action="confirm">${esc(confirm)}</button>`,
    onMount(panel) { panel._confirm = () => { closeSheet(); onConfirm(); }; } });
}

/* ---------- Actions ---------- */
const moduleCtx = () => { const f = $('[data-module]'); return f ? { p: getP(f.dataset.pid), m: getM(f.dataset.mid), form: f } : {}; };

const actions = {
  'enter-project'(el) { session.role = 'participant'; session.projectId = el.dataset.id; saveSession(); location.hash = `#/p/${el.dataset.id}`; },
  'enter-curator'() { session.role = 'curator'; session.projectId = null; saveSession(); location.hash = '#/curator'; },
  'logout'() { session.role = null; session.projectId = null; saveSession(); if (location.hash === '#/' || !location.hash) route(); else location.hash = '#/'; },
  'create-project'() { projectSheet(null); },
  'edit-project'(el) { projectSheet(getP(el.dataset.id)); },
  'save-project'() { Sheet.panel?._save(); },
  'add-member'() { Sheet.panel?._rerenderMembers(l => l.push({ id: uid('u'), name: '', role: '', skills: [], contact: '', openToProjects: false, endorsements: {} })); Sheet.panel.querySelector('[data-member]:last-child input')?.focus(); },
  'rm-member'(el) { Sheet.panel?._rerenderMembers(l => l.splice(+el.dataset.i, 1)); },
  'close-sheet'() { closeSheet(); },
  'confirm'() { Sheet.panel?._confirm(); },

  'toggle-publish'(el) {
    const p = getP(el.dataset.id); p.published = el.checked; p.updatedAt = Date.now(); save();
    toast(p.published ? 'One-pager опубликован в галерее Demo Day' : 'One-pager скрыт из галереи'); rerender();
  },
  'delete-project'(el) {
    const idx = S.projects.findIndex(x => x.id === el.dataset.id); if (idx < 0) return;
    const [p] = S.projects.splice(idx, 1); save();
    const wasOwn = session.projectId === p.id && session.role === 'participant';
    if (wasOwn) { session.role = null; session.projectId = null; saveSession(); }
    if (!isCurator()) location.hash = '#/'; else if (location.hash.startsWith('#/p/')) location.hash = '#/curator'; else rerender();
    toast(`Проект «${p.name}» удалён`, { label: 'Отменить', action() {
      S.projects.splice(Math.min(idx, S.projects.length), 0, p); save();
      if (wasOwn) { session.role = 'participant'; session.projectId = p.id; saveSession(); location.hash = `#/p/${p.id}`; } else rerender();
    } });
  },

  'submit-module'() {
    const { p, m, form } = moduleCtx(); if (!p) return;
    let firstBad = null;
    m.fields.forEach(f => {
      const bad = f.required && !String(p.answers[m.id]?.[f.id] || '').trim();
      const box = form.querySelector(`[data-fbox="${CSS.escape(f.id)}"]`);
      box.classList.toggle('invalid', bad);
      box.querySelector('[data-field]').setAttribute('aria-invalid', bad);
      if (bad && !firstBad) firstBad = box;
    });
    if (firstBad) { firstBad.querySelector('[data-field]').focus(); firstBad.scrollIntoView({ block: 'center', behavior: reduceMotion.matches ? 'auto' : 'smooth' }); toast('Заполните обязательные поля'); return; }
    const wasDone = isDone(p, m);
    const values = {}; m.fields.forEach(f => values[f.id] = String(p.answers[m.id]?.[f.id] || ''));
    (p.history[m.id] ||= []).push({ at: Date.now(), values });
    p.submitted[m.id] = Date.now(); p.review[m.id] = 'pending'; p.updatedAt = Date.now();
    save(); rerender();
    if (wasDone) toast(`Версия ${p.history[m.id].length} отправлена куратору`);
    else completionSheet(p, m);
  },
  'restore'(el, e) {
    e.preventDefault();
    const { p, m } = moduleCtx(); const v = p.history[m.id][+el.dataset.idx]; if (!v) return;
    const prev = clone(p.answers[m.id] || {});
    p.answers[m.id] = clone(v.values); p.updatedAt = Date.now(); save(); rerender();
    toast('Ответы восстановлены из версии', { label: 'Отменить', action() { p.answers[m.id] = prev; save(); rerender(); } });
  },
  'add-comment'() {
    const { p, m } = moduleCtx(); const ta = $('#cmt'); const text = ta.value.trim();
    if (!text) { ta.focus(); return; }
    (p.comments[m.id] ||= []).push({ id: uid('c'), author: isCurator() ? 'Куратор' : p.name, role: session.role, text, at: Date.now() });
    p.updatedAt = Date.now(); save(); rerender(); toast('Комментарий отправлен');
  },
  'review'(el) {
    const { p, m } = moduleCtx(); p.review[m.id] = el.dataset.v; save(); rerender();
    toast(el.dataset.v === 'approved' ? 'Модуль принят' : 'Отправлено на доработку — оставьте комментарий');
    if (el.dataset.v === 'changes') $('#cmt')?.focus();
  },

  'print'() { window.print(); },
  async 'copy-share'(el) {
    const p = getP(el.dataset.id);
    const url = location.href.split('#')[0] + '#/share/' + encodeShare(onePagerData(p));
    const ok = await copyText(url);
    openSheet({ title: 'Публичная ссылка',
      body: `<p class="muted" style="margin-bottom:12px">${ok ? 'Ссылка скопирована. ' : ''}Это снимок one-pager на текущий момент: данные зашиты в саму ссылку, поэтому она открывается без входа и без сервера. После новых ответов скопируйте ссылку заново.</p><input class="input" readonly value="${esc(url)}" onfocus="this.select()" aria-label="Ссылка">`,
      footer: `<a class="btn ghost" href="${esc(url)}">${icon('eye')}Открыть</a><button class="btn primary" data-action="close-sheet">Готово</button>` });
  },

  'team-filter'(el) { ui.teamFilter = el.dataset.v; rerender(); },
  'like'(el) {
    const p = getP(el.dataset.id); const i = session.liked.indexOf(p.id);
    if (i >= 0) { session.liked.splice(i, 1); p.likes = Math.max(0, (p.likes || 0) - 1); } else { session.liked.push(p.id); p.likes = (p.likes || 0) + 1; }
    save(); saveSession();
    el.classList.toggle('on', i < 0); el.setAttribute('aria-pressed', i < 0); el.querySelector('span').textContent = p.likes;
    el.classList.remove('pop'); void el.offsetWidth; if (i < 0) el.classList.add('pop');
  },
  'endorse'(el) {
    const p = getP(el.dataset.pid); const m = p?.members.find(x => x.id === el.dataset.uid); if (!m) return;
    const s = el.dataset.skill, key = `${m.id}:${s}`, i = session.endorsed.indexOf(key);
    m.endorsements ||= {};
    if (i >= 0) { session.endorsed.splice(i, 1); m.endorsements[s] = Math.max(0, (m.endorsements[s] || 0) - 1); }
    else { session.endorsed.push(key); m.endorsements[s] = (m.endorsements[s] || 0) + 1; }
    save(); saveSession();
    el.classList.toggle('on', i < 0); el.setAttribute('aria-pressed', i < 0); el.textContent = '+' + m.endorsements[s];
  },
  'people-skill'(el) { ui.peopleSkill = el.dataset.v; rerender(); },
  'people-open'(el) { ui.peopleOpen = el.checked; $('#people-list').innerHTML = peopleListHTML(); },
  async 'copy-contact'(el) { const ok = await copyText(el.dataset.v); toast(ok ? `Контакт ${el.dataset.v} скопирован` : el.dataset.v); },

  'edit-module'(el) { moduleSheet(el.dataset.id ? getM(el.dataset.id) : null); },
  'save-module'() { Sheet.panel?._save(); },
  'add-field'() { Sheet.panel?._fields(l => l.push({ id: uid('f'), label: '', placeholder: '', type: 'textarea', required: false })); Sheet.panel.querySelector('[data-fi]:last-child input')?.focus(); },
  'rm-field'(el) { Sheet.panel?._fields(l => l.splice(+el.dataset.i, 1)); },
  'move-module'(el) {
    const i = S.modules.findIndex(m => m.id === el.dataset.id), j = i + +el.dataset.dir;
    if (j < 0 || j >= S.modules.length) return;
    [S.modules[i], S.modules[j]] = [S.modules[j], S.modules[i]]; save(); rerender();
  },
  'delete-module'(el) {
    if (S.modules.length <= 3) { toast('В программе должно быть минимум 3 модуля'); return; }
    const idx = S.modules.findIndex(m => m.id === el.dataset.id); const [m] = S.modules.splice(idx, 1); save(); rerender();
    toast(`Модуль «${m.title}» удалён`, { label: 'Отменить', action() { S.modules.splice(idx, 0, m); save(); rerender(); } });
  },

  'reset-demo'() {
    confirmSheet({ title: 'Сбросить демо-данные?', text: 'Все проекты, ответы, комментарии и изменения модулей в этом браузере будут заменены исходными демо-данными.', confirm: 'Сбросить',
      onConfirm() { S = seed(); save(); session = { liked: [], endorsed: [] }; saveSession(); location.hash = '#/'; route(); toast('Демо-данные восстановлены'); } });
  },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.tagName === 'INPUT') return;
  const fn = actions[el.dataset.action]; if (!fn) return;
  if (el.tagName === 'BUTTON' || el.tagName === 'DIV') e.preventDefault();
  fn(el, e);
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('input[data-action]'); if (el && actions[el.dataset.action]) actions[el.dataset.action](el, e);
});

// Autosave: every keystroke is persisted immediately (localStorage is synchronous)
let saveTimer;
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.matches('[data-field]')) {
    const { p, m } = moduleCtx(); if (!p || isCurator()) return;
    (p.answers[m.id] ||= {})[t.dataset.field] = t.value;
    p.updatedAt = Date.now();
    const ok = save();
    const box = t.closest('[data-fbox]');
    box.querySelector('[data-count]').textContent = t.value.length;
    if (t.value.trim()) { box.classList.remove('invalid'); t.removeAttribute('aria-invalid'); }
    const ss = $('#savestate');
    if (ss && ok) {
      ss.classList.add('saving'); ss.querySelector('span').textContent = 'Сохранение…';
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => { ss.classList.remove('saving'); ss.querySelector('span').textContent = 'Сохранено · ' + new Intl.DateTimeFormat('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(Date.now()); }, 350);
    }
    const btn = $('[data-action="submit-module"]');
    if (btn && isDone(p, m)) btn.textContent = changedSinceSubmit(p, m) ? 'Отправить новую версию' : 'Отправить заново';
  } else if (t.matches('[data-filter="teams"]')) { ui.teamQuery = t.value; $('#teams-list').innerHTML = teamsListHTML(); }
  else if (t.matches('[data-filter="people"]')) { ui.peopleQuery = t.value; $('#people-list').innerHTML = peopleListHTML(); }
  else if (t.closest('.sheet .field.invalid') && t.value.trim()) t.closest('.field').classList.remove('invalid');
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && Sheet.root) { e.preventDefault(); closeSheet(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    if (Sheet.panel?._save) { e.preventDefault(); Sheet.panel._save(); }
    else if ($('[data-action="submit-module"]')) { e.preventDefault(); actions['submit-module'](); }
    else if (document.activeElement?.id === 'cmt') { e.preventDefault(); actions['add-comment'](); }
  }
});
// Sync across tabs
addEventListener('storage', (e) => { if (e.key === LS_KEY && e.newValue && !document.activeElement?.matches('[data-field]')) { S = load(); S.projects.forEach(normalize); rerender(); } });

lastPath = location.hash;
route();
</script>
</body>
</html>
